# LLM 配置
llm:
#  llm_model: "qwen-plus"
  llm_model: "deepseek-chat"
  temperature: 0.7
  max_tokens: 2000

# rerank模型配置
rerank:
  enabled: true  # 是否启用rerank功能
  model_path: "D:/models/bge-reranker-base"

# 嵌入模型配置
embedding:
  model_path: "D:/models/bge-small-zh-v1.5"
  model_name: "bge-small-zh-v1.5"
  dimension: 1024  # bge-large 的向量维度
  similarity_threshold: 0.5
  index_path: "data/vector_store"

# 图谱管理配置
graph:
  merge_threshold: 0.8  # 记忆合并阈值
  visualization:
    node_size: 1000
    edge_alpha: 0.5
    figure_size: [12, 8]
  storage:
    save_interval: 300  # 自动保存间隔（秒）
    backup_count: 3    # 保留的备份文件数量

# 角色配置路径
roles_path: roles/
templates_path: templates/

# 系统级提示词
system_prompts:
  error: "抱歉，我现在遇到了一些问题。让我们换个话题吧。"
  greeting: "欢迎来到圣诞老人的小屋！"
  role_switch: "好的，我现在切换到{role}的角色。"

memory:
  max_memories: 1000
  clean_threshold: 0.85
  similarity_threshold: 0.45
  access_history_limit: 10  # 保存最近访问历史的数量
  priority_weights:
    time: 0.3
    importance: 0.4
    access: 0.3
  storage:
    save_interval: 300  # 自动保存间隔（秒）
    backup_count: 3    # 保留的备份文件数量
  access_stats:
    history_limit: 10  # 保存最近访问历史的数量
    cleanup_interval: 86400  # 清理历史记录的间隔（秒）
  access_types:
    read: 1.0      # 直接读取权重
    write: 1.5     # 写入权重
    reference: 0.8  # 检索引用权重
  
  # 簇内召回补偿配置
  intra_cluster_recall:
    enabled: false  # 是否启用簇内召回补偿
    keyword_match_weight: 0.6  # 关键词匹配权重
    tfidf_similarity_weight: 0.4  # TF-IDF相似度权重
    top_k_compensate: 3  # 补偿召回的记忆数量
    min_compensate_score: 0.3  # 最小补偿分数阈值
