# 系统级指令模板
system:
  # 基础系统指令
  base: |
    {%- if role_prompt %}
    {{ role_prompt }}
    {% endif %}

    {%- if memories %}
    已知用户相关信息：
    {% for memory in memories|sort_by_relevance %}
    - {{ memory }}
    {% endfor %}
    {% endif %}

  # 记忆管理相关指令
  memory_manager: |
    你是一个记忆管理助手，需要：
    1. 对用户记忆进行分类和整理
    2. 合并相似的记忆
    3. 删除重复或无意义的记忆
    4. 保持记忆的准确性和时效性

  # 对话管理相关指令
  conversation_manager: |
    你需要：
    1. 保持对话的连贯性和上下文理解
    2. 根据用户的历史偏好调整回答
    3. 在合适的时候引用之前的对话内容
    4. 避免重复已经讨论过的内容

  # RAG 增强指令
  rag_enhancement: |
    在回答问题时：
    1. 优先使用与当前问题最相关的信息
    2. 确保引用的信息准确且适时
    3. 将知识库信息与用户具体情况相结合
    4. 在不确定时说明信息来源 