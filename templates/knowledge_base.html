<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG 知识库管理系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/@mdi/font@6.5.95/css/materialdesignicons.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-50">
    <div class="min-h-screen flex">
        <!-- 侧边栏 -->
        <aside class="w-64 bg-white shadow-lg">
            <div class="p-4 border-b">
                <div class="flex items-center justify-between">
                    <h1 class="text-xl font-bold text-gray-800">知识库管理</h1>
                    <a href="/" class="text-blue-600 hover:text-blue-800">返回对话</a>
                </div>
            </div>
            <nav class="p-4 space-y-2">
                <button onclick="showTab('documents')" class="w-full flex items-center px-4 py-2 text-gray-700 bg-gray-100 rounded-lg">
                    <span class="mdi mdi-folder-multiple mr-3"></span>
                    文档管理
                </button>
                <button onclick="showTab('content')" class="w-full flex items-center px-4 py-2 text-gray-700 hover:bg-gray-100 rounded-lg">
                    <span class="mdi mdi-file-document-edit mr-3"></span>
                    内容管理
                </button>
                <button onclick="showTab('index')" class="w-full flex items-center px-4 py-2 text-gray-700 hover:bg-gray-100 rounded-lg">
                    <span class="mdi mdi-database mr-3"></span>
                    索引管理
                </button>
            </nav>
        </aside>

        <!-- 主内容区 -->
        <main class="flex-1 p-8">
            <!-- 文档管理页面 -->
            <div id="documents-tab" class="space-y-6">
                <!-- 顶部操作栏 -->
                <div class="flex justify-between items-center">
                    <div class="flex gap-4">
                        <button onclick="showUploadModal()" class="bg-blue-500 text-white px-4 py-2 rounded-lg flex items-center hover:bg-blue-600">
                            <span class="mdi mdi-upload mr-2"></span>
                            上传文档
                        </button>
                        <button onclick="showIndexModal()" class="bg-green-500 text-white px-4 py-2 rounded-lg flex items-center hover:bg-green-600">
                            <span class="mdi mdi-refresh mr-2"></span>
                            更新索引
                        </button>
                    </div>
                    <div class="flex gap-4">
                        <select id="docTypeFilter" class="px-4 py-2 border rounded-lg">
                            <option value="">所有类型</option>
                            <option value="pdf">PDF文档</option>
                            <option value="docx">Word文档</option>
                            <option value="md">Markdown</option>
                            <option value="txt">纯文本</option>
                        </select>
                        <input type="text" id="searchDocs" placeholder="搜索文档..." 
                            class="px-4 py-2 border rounded-lg w-64">
                    </div>
                </div>

                <!-- 文档列表 -->
                <div class="container mx-auto px-4 py-8">
                    <div class="bg-white shadow rounded-lg">
                        <div class="px-4 py-5 border-b border-gray-200 sm:px-6">
                            <div class="flex justify-between items-center">
                                <h3 class="text-lg leading-6 font-medium text-gray-900">
                                    知识库管理
                                </h3>
                                <button onclick="showUploadModal()"
                                    class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700">
                                    上传文档
                                </button>
                            </div>
                        </div>

                        <div class="flex flex-col">
                            <div class="-my-2 overflow-x-auto sm:-mx-6 lg:-mx-8">
                                <div class="py-2 align-middle inline-block min-w-full sm:px-6 lg:px-8">
                                    <div class="shadow overflow-hidden border-b border-gray-200 sm:rounded-lg">
                                        <table class="min-w-full divide-y divide-gray-200">
                                            <thead class="bg-gray-50">
                                                <tr>
                                                    <th scope="col"
                                                        class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                                        文件名
                                                    </th>
                                                    <th scope="col"
                                                        class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                                        类型
                                                    </th>
                                                    <th scope="col"
                                                        class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                                        大小
                                                    </th>
                                                    <th scope="col"
                                                        class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                                        状态
                                                    </th>
                                                    <th scope="col" class="relative px-6 py-3">
                                                        <span class="sr-only">操作</span>
                                                    </th>
                                                </tr>
                                            </thead>
                                            <tbody id="documents-container" class="bg-white divide-y divide-gray-200">
                                                <!-- 文档列表将通过 JavaScript 动态插入 -->
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 内容管理页面 -->
            <div id="content-tab" class="hidden space-y-6">
                <!-- 内容编辑区域 -->
                <div class="bg-white rounded-lg shadow p-6">
                    <h2 class="text-lg font-semibold mb-4">内容编辑</h2>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">分段设置</label>
                            <div class="flex gap-4">
                                <input type="number" class="px-4 py-2 border rounded-lg w-32" placeholder="段落大小">
                                <select class="px-4 py-2 border rounded-lg">
                                    <option>按段落</option>
                                    <option>按字数</option>
                                    <option>按句子</option>
                                </select>
                                <button class="px-4 py-2 bg-blue-500 text-white rounded-lg">应用</button>
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">内容预览</label>
                            <div class="border rounded-lg p-4 min-h-[200px] max-h-[400px] overflow-y-auto">
                                <!-- 内容预览区域 -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 索引管理页面 -->
            <div id="index-tab" class="hidden space-y-6">
                <!-- 索引状态卡片 -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div class="bg-white rounded-lg shadow p-6">
                        <h3 class="text-lg font-semibold mb-4">索引状态</h3>
                        <div class="space-y-2">
                            <p>总文档数：<span id="totalDocs">0</span></p>
                            <p>已索引：<span id="indexedDocs">0</span></p>
                            <p>索引大小：<span id="indexSize">0 MB</span></p>
                        </div>
                    </div>
                    <div class="bg-white rounded-lg shadow p-6">
                        <h3 class="text-lg font-semibold mb-4">索引操作</h3>
                        <div class="space-y-2">
                            <button onclick="rebuildIndex()" class="w-full px-4 py-2 bg-blue-500 text-white rounded-lg">重建索引</button>
                            <button onclick="optimizeIndex()" class="w-full px-4 py-2 bg-green-500 text-white rounded-lg">优化索引</button>
                            <button onclick="backupIndex()" class="w-full px-4 py-2 bg-yellow-500 text-white rounded-lg">备份索引</button>
                        </div>
                    </div>
                    <div class="bg-white rounded-lg shadow p-6">
                        <h3 class="text-lg font-semibold mb-4">索引配置</h3>
                        <div class="space-y-2">
                            <div class="flex justify-between items-center">
                                <span>向量维度</span>
                                <input type="number" value="512" class="border rounded px-2 py-1 w-24">
                            </div>
                            <div class="flex justify-between items-center">
                                <span>相似度阈值</span>
                                <input type="number" value="0.8" step="0.1" min="0" max="1" class="border rounded px-2 py-1 w-24">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- 上传文档模态框 -->
    <div id="uploadModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center">
        <div class="bg-white rounded-lg p-6 w-full max-w-md">
            <h3 class="text-lg font-semibold mb-4">上传文档</h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">选择文件</label>
                    <input type="file" id="fileInput" multiple
                        class="mt-1 block w-full text-sm text-gray-500
                        file:mr-4 file:py-2 file:px-4
                        file:rounded-full file:border-0
                        file:text-sm file:font-semibold
                        file:bg-blue-50 file:text-blue-700
                        hover:file:bg-blue-100">
                    <p class="mt-1 text-sm text-gray-500">
                        支持的文件类型: PDF, Word, Markdown, 文本文件
                    </p>
                </div>
                <div class="flex justify-end gap-4">
                    <button onclick="closeUploadModal()" 
                        class="px-4 py-2 bg-gray-100 text-gray-800 rounded hover:bg-gray-200">
                        取消
                    </button>
                    <button onclick="uploadDocuments()" 
                        class="px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600">
                        上传
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 通知容器 -->
    <div id="notificationContainer" class="fixed bottom-4 right-4 z-50"></div>

    <script>
        let documents = [];
        
        // 页面加载时获取文档列表
        document.addEventListener('DOMContentLoaded', () => {
            loadDocuments();
            updateIndexStats();
            
            // 添加标签切换功能
            document.querySelectorAll('[onclick^="showTab"]').forEach(button => {
                button.addEventListener('click', (e) => {
                    const tabName = e.target.getAttribute('onclick').match(/'([^']+)'/)[1];
                    showTab(tabName);
                });
            });
        });

        // 显示/隐藏不同的标签页
        function showTab(tabName) {
            document.querySelectorAll('[id$="-tab"]').forEach(tab => {
                tab.classList.add('hidden');
            });
            document.getElementById(`${tabName}-tab`).classList.remove('hidden');
        }

        // 加载文档列表
        async function loadDocuments() {
            try {
                const response = await fetch('/api/documents');
                const data = await response.json();
                
                if (data.success) {
                    documents = data.documents;
                    renderDocuments(documents);
                    updateIndexStats();
                } else {
                    showNotification(data.error, 'error');
                }
            } catch (error) {
                console.error('Error loading documents:', error);
                showNotification('Failed to load documents', 'error');
            }
        }

        // 渲染文档列表
        function renderDocuments(documentsToRender) {
            const tbody = document.getElementById('documents-container');
            tbody.innerHTML = documentsToRender.map(doc => {
                const date = new Date(doc.timestamp);
                return `
                    <tr class="hover:bg-gray-50">
                        <td class="px-6 py-4 whitespace-nowrap">
                            <div class="text-sm text-gray-900">${doc.file_name}</div>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <div class="text-sm text-gray-500">${doc.file_type}</div>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <div class="text-sm text-gray-500">${formatFileSize(doc.file_size)}</div>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full ${getStatusColor(doc.status)}">
                                ${doc.status}
                            </span>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                            <button onclick="deleteDocument('${doc.id}')" 
                                class="text-red-600 hover:text-red-900">
                                删除
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        // 文件上传
        async function uploadDocuments() {
            const fileInput = document.querySelector('#fileInput');
            const files = fileInput.files;
            
            if (files.length === 0) {
                showNotification('请选择要上传的文件', 'error');
                return;
            }
            
            const formData = new FormData();
            for (let i = 0; i < files.length; i++) {
                formData.append('files', files[i]);
            }
            
            try {
                const response = await fetch('/api/documents', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showNotification('文档上传成功');
                    closeUploadModal();
                    loadDocuments();
                } else {
                    showNotification(data.error, 'error');
                }
            } catch (error) {
                console.error('Error uploading documents:', error);
                showNotification('文档上传失败', 'error');
            }
        }

        // 删除文档
        async function deleteDocument(fileHash) {
            if (!confirm('确定要删除这个文档吗？')) {
                return;
            }
            
            try {
                const response = await fetch(`/api/documents/${fileHash}`, {
                    method: 'DELETE'
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showNotification('文档删除成功');
                    loadDocuments();
                } else {
                    showNotification(data.error, 'error');
                }
            } catch (error) {
                console.error('Error deleting document:', error);
                showNotification('文档删除失败', 'error');
            }
        }

        // 更新索引统计信息
        async function updateIndexStats() {
            try {
                const response = await fetch('/api/documents/stats');
                const data = await response.json();
                
                if (data.success) {
                    document.getElementById('totalDocs').textContent = data.total_documents;
                    document.getElementById('indexedDocs').textContent = data.total_indexed;
                    document.getElementById('indexSize').textContent = formatFileSize(data.index_size);
                } else {
                    console.error('Error fetching index stats:', data.error);
                }
            } catch (error) {
                console.error('Error updating index stats:', error);
            }
        }

        // 显示上传模态框
        function showUploadModal() {
            document.getElementById('uploadModal').classList.remove('hidden');
        }

        // 关闭上传模态框
        function closeUploadModal() {
            document.getElementById('uploadModal').classList.add('hidden');
            document.getElementById('fileInput').value = '';
        }

        // 辅助函数
        function getFileIcon(type) {
            const icons = {
                'pdf': 'mdi-file-pdf',
                'docx': 'mdi-file-word',
                'txt': 'mdi-file-document',
                'md': 'mdi-language-markdown'
            };
            return icons[type] || 'mdi-file';
        }

        function getTypeColor(type) {
            const colors = {
                'pdf': 'bg-red-100 text-red-800',
                'docx': 'bg-blue-100 text-blue-800',
                'txt': 'bg-gray-100 text-gray-800',
                'md': 'bg-purple-100 text-purple-800'
            };
            return colors[type] || 'bg-gray-100 text-gray-800';
        }

        function getStatusColor(status) {
            const colors = {
                'indexed': 'bg-green-100 text-green-800',
                'processing': 'bg-yellow-100 text-yellow-800',
                'error': 'bg-red-100 text-red-800'
            };
            return colors[status] || 'bg-gray-100 text-gray-800';
        }

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        function formatDate(date) {
            return date.toLocaleString('zh-CN', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        // 显示通知
        function showNotification(message, type = 'info') {
            const container = document.getElementById('notificationContainer');
            const notification = document.createElement('div');
            
            notification.className = `mb-2 p-4 rounded shadow-lg ${
                type === 'error' ? 'bg-red-500' : 'bg-green-500'
            } text-white`;
            
            notification.textContent = message;
            
            container.appendChild(notification);
            
            // 3秒后自动消失
            setTimeout(() => {
                notification.remove();
            }, 3000);
        }
    </script>
</body>
</html>
