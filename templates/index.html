<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圣诞主题对话系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .gradient-bg {
            background: linear-gradient(90deg, rgba(227,32,36,1) 0%, rgba(0,123,0,1) 100%);
        }
        .christmas-header {
            background: linear-gradient(to right, #ff0000, #00ff00);
            color: white;
        }
        .snowflake {
            position: absolute;
            width: 1em;
            height: 1em;
            background: white;
            opacity: 0.8;
            border-radius: 50%;
            animation: snowfall 10s linear infinite;
        }
        @keyframes snowfall {
            from { transform: translateY(-100%); }
            to { transform: translateY(100vh); }
        }
    </style>
</head>
<body class="flex flex-col h-screen bg-green-100 relative">
    <div class="absolute top-4 left-4 text-xl cursor-pointer" title="帮助">❓</div>
    <div class="absolute top-4 right-4 text-xl cursor-pointer" title="设置">⚙️</div>

    <div class="flex justify-center items-center christmas-header py-4 shadow-lg">
        <h1 class="text-2xl font-bold">🎄 圣诞快乐！！ 🎁</h1>
    </div>

    <div class="flex flex-col flex-grow overflow-hidden">
        <div id="messages" class="flex-grow overflow-y-auto p-6 space-y-4 bg-white shadow-lg rounded-lg mx-4 mt-4">
            <!-- 消息会动态加载到这里 -->
        </div>

        <div class="flex justify-center py-4">
            <img src="https://picx.zhimg.com/v2-0073a8a49b65ac0e83bf20db4cf4ba53_720w.jpg?source=172ae18b" alt="圣诞装饰" class="rounded-full shadow-lg">
        </div>

        <div id="status" class="text-center text-sm text-gray-500 my-2"></div>

        <div class="flex items-center p-4 bg-white border-t border-gray-300 gradient-bg">
            <img src="/static/images/Christmas_reindeer_avatar_80x80.png" alt="助手头像" class="w-10 h-10 rounded-full mr-4 shadow-lg">
            <input id="user_input" type="text" placeholder="请输入内容" onkeydown="checkEnter(event)" class="flex-grow px-4 py-2 border border-gray-300 rounded-lg shadow focus:outline-none focus:ring-2 focus:ring-green-500">
            <button onclick="sendMessage()" class="ml-4 px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 shadow-md focus:outline-none">发送</button>
        </div>
    </div>

    <footer class="bg-green-200 py-2 text-center text-sm text-red-600">
        © 2024 圣诞对话系统 - All rights reserved.
    </footer>

    <!-- Falling Snowflakes -->
    <div class="snowflake" style="top: 0; left: 10%; animation-delay: 0s;"></div>
    <div class="snowflake" style="top: 0; left: 30%; animation-delay: 2s;"></div>
    <div class="snowflake" style="top: 0; left: 50%; animation-delay: 4s;"></div>
    <div class="snowflake" style="top: 0; left: 70%; animation-delay: 6s;"></div>
    <div class="snowflake" style="top: 0; left: 90%; animation-delay: 8s;"></div>

    <script>
        function addMessage(content, type) {
            const messagesDiv = document.getElementById('messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `flex items-center max-w-xs p-4 rounded-lg ${type === 'user' ? 'ml-auto bg-red-100' : 'mr-auto bg-green-100'} shadow`;
            if (type === 'assistant') {
                const avatar = document.createElement('img');
                avatar.src = "/static/images/Christmas_reindeer_avatar_80x80.png";
                avatar.alt = "助手头像";
                avatar.className = "w-8 h-8 rounded-full mr-4";
                messageDiv.appendChild(avatar);
            }
            const messageText = document.createElement('span');
            messageText.textContent = content;
            messageDiv.appendChild(messageText);
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        async function sendMessage() {
            const userInput = document.getElementById('user_input').value;
            if (!userInput.trim()) return;

            addMessage(userInput, 'user');
            document.getElementById('user_input').value = '';

            const statusDiv = document.getElementById('status');
            statusDiv.textContent = '正在输入...';

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_input: userInput })
                });
                const result = await response.json();
                addMessage(result.response, 'assistant');
            } catch (error) {
                addMessage('网络异常，请稍后重试。', 'assistant');
            } finally {
                statusDiv.textContent = '';
            }
        }

        function checkEnter(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
    </script>
</body>
</html>
