<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>记忆管理系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <div class="container mx-auto px-4 py-8">
        <!-- 顶部导航 -->
        <nav class="flex justify-between items-center mb-8">
            <h1 class="text-2xl font-bold text-gray-800">记忆管理系统</h1>
            <a href="/" class="text-blue-600 hover:text-blue-800">返回对话</a>
        </nav>

        <!-- 记忆分类标签 -->
        <div class="mb-6">
            <h2 class="text-lg font-semibold mb-3">记忆分类</h2>
            <div class="flex flex-wrap gap-2" id="memoryTags">
                <button class="px-3 py-1 bg-blue-100 text-blue-800 rounded-full active" data-type="all">全部</button>
                <button class="px-3 py-1 bg-gray-100 hover:bg-blue-100 text-gray-800 rounded-full" data-type="fact">事实</button>
                <button class="px-3 py-1 bg-gray-100 hover:bg-blue-100 text-gray-800 rounded-full" data-type="preference">偏好</button>
                <button class="px-3 py-1 bg-gray-100 hover:bg-blue-100 text-gray-800 rounded-full" data-type="dialogue">对话</button>
            </div>
        </div>

        <!-- 记忆管理工具栏 -->
        <div class="flex justify-between items-center mb-6">
            <div class="flex gap-4">
                <button onclick="showAddMemoryModal()" class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">
                    添加记忆
                </button>
                <button onclick="restructureSelectedMemories()" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
                    重构选中记忆
                </button>
                <button onclick="cleanMemories()" class="bg-yellow-500 text-white px-4 py-2 rounded hover:bg-yellow-600">
                    清理重复记忆
                </button>
            </div>
            <div class="flex gap-2">
                <input type="text" id="searchMemory" placeholder="搜索记忆..." 
                    class="px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-300">
            </div>
        </div>

        <!-- 记忆列表 -->
        <div class="bg-white rounded-lg shadow overflow-hidden">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50">
                    <tr>
                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                            <input type="checkbox" id="selectAll" class="rounded">
                        </th>
                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                            内容
                        </th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">类型</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">时间</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">操作</th>
                    </tr>
                </thead>
                <tbody id="memoriesList" class="bg-white divide-y divide-gray-200">
                    <!-- 记忆列表将在这里动态渲染 -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- 添加记忆模态框 -->
    <div id="addMemoryModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center">
        <div class="bg-white rounded-lg p-6 w-full max-w-2xl">
            <h3 class="text-lg font-semibold mb-4">添加新记忆</h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">记忆类型</label>
                    <select id="memoryType" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm">
                        <option value="fact">事实</option>
                        <option value="preference">偏好</option>
                        <option value="dialogue">对话</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">记忆内容</label>
                    <textarea id="memoryContent" rows="4" 
                        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm"></textarea>
                </div>
                <div class="flex justify-end gap-4">
                    <button onclick="closeAddMemoryModal()" 
                        class="px-4 py-2 bg-gray-100 text-gray-800 rounded hover:bg-gray-200">取消</button>
                    <button onclick="addNewMemory()" 
                        class="px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600">保存</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 记忆重构模态框 -->
    <div id="restructureModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center">
        <div class="bg-white rounded-lg p-6 w-full max-w-4xl">
            <h3 class="text-lg font-semibold mb-4">重构记忆</h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">选择重构模板</label>
                    <select id="restructureTemplate" onchange="updateRestructurePreview()" 
                        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm">
                        <option value="fact">事实陈述</option>
                        <option value="preference">个人偏好</option>
                        <option value="personality">性格特征</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">重构预览</label>
                    <div id="restructurePreview" class="space-y-4">
                        <!-- 预览内容将在这里动态生成 -->
                    </div>
                </div>
                <div class="flex justify-end gap-4 mt-6">
                    <button onclick="closeRestructureModal()" 
                        class="px-4 py-2 bg-gray-100 text-gray-800 rounded hover:bg-gray-200">取消</button>
                    <button onclick="saveRestructuredMemories()" 
                        class="px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600">确认重构</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 在 body 标签的最后添加通知容器 -->
    <div id="notificationContainer" class="fixed bottom-4 right-4 z-50"></div>

    <script>
        let memories = [];
        let selectedMemories = new Set();

        // 页面加载时获取记忆
        document.addEventListener('DOMContentLoaded', () => {
            fetchMemories();
            
            // 添加全选功能
            document.getElementById('selectAll').addEventListener('change', (e) => {
                const checkboxes = document.querySelectorAll('.memory-checkbox');
                checkboxes.forEach(checkbox => {
                    checkbox.checked = e.target.checked;
                    const memoryId = parseInt(checkbox.value);
                    if (e.target.checked) {
                        selectedMemories.add(memoryId);
                    } else {
                        selectedMemories.delete(memoryId);
                    }
                });
                
                // 更新重构按钮状态
                updateRestructureButtonState();
            });

            // 添加搜索功能
            document.getElementById('searchMemory').addEventListener('input', (e) => {
                const searchText = e.target.value.toLowerCase();
                const filteredMemories = memories.filter(memory => 
                    memory.content.toLowerCase().includes(searchText)
                );
                renderMemories(filteredMemories);
            });

            // 添加分类筛选功能
            document.querySelectorAll('#memoryTags button').forEach(button => {
                button.addEventListener('click', () => {
                    const type = button.dataset.type;
                    document.querySelectorAll('#memoryTags button').forEach(b => 
                        b.classList.remove('bg-blue-100', 'text-blue-800'));
                    button.classList.add('bg-blue-100', 'text-blue-800');
                    
                    if (type === 'all') {
                        renderMemories(memories);
                    } else {
                        const filteredMemories = memories.filter(memory => 
                            memory.type === type
                        );
                        renderMemories(filteredMemories);
                    }
                });
            });
        });

        // 获取记忆列表
        async function fetchMemories() {
            try {
                const response = await fetch('/api/memories');
                const data = await response.json();
                
                console.log('Response from server:', data);  // 添加调试日志
                
                if (data.memories) {
                    memories = data.memories;
                    console.log('Loaded memories:', memories);  // 添加调试日志
                    
                    if (Array.isArray(memories)) {
                        renderMemories(memories);
                    } else {
                        console.error('Memories is not an array:', memories);
                        alert('记忆数据格式错误');
                    }
                } else {
                    console.error('No memories data in response:', data);
                    if (data.error) {
                        console.error('Error details:', data.details);  // 显示详细错误信息
                        alert(`获取记忆列表失败: ${data.error}\n${data.details || ''}`);
                    } else {
                        alert('获取记忆列表失败：未知错误');
                    }
                }
            } catch (error) {
                console.error('Error fetching memories:', error);
                alert('获取记忆列表失败，请检查控制台获取详细信息');
            }
        }

        // 渲染记忆列表
        function renderMemories(memoriesToRender) {
            const tbody = document.getElementById('memoriesList');
            
            if (!Array.isArray(memoriesToRender)) {
                console.error('memoriesToRender is not an array:', memoriesToRender);
                return;
            }
            
            try {
                // 重置全选框
                const selectAllCheckbox = document.getElementById('selectAll');
                if (selectAllCheckbox) {
                    selectAllCheckbox.checked = false;
                }
                
                tbody.innerHTML = memoriesToRender.map((memory, index) => {
                    try {
                        const date = new Date(memory.timestamp);
                        const formattedDate = date.toLocaleString('zh-CN', {
                            year: 'numeric',
                            month: '2-digit',
                            day: '2-digit',
                            hour: '2-digit',
                            minute: '2-digit'
                        });

                        return `
                            <tr class="hover:bg-gray-50" data-memory-id="${index}">
                                <td class="px-6 py-4 whitespace-nowrap">
                                    <input type="checkbox" class="memory-checkbox rounded" 
                                        value="${index}" 
                                        ${selectedMemories.has(index) ? 'checked' : ''}>
                                </td>
                                <td class="px-6 py-4">
                                    <div class="text-sm text-gray-900 whitespace-pre-wrap">${memory.content}</div>
                                </td>
                                <td class="px-6 py-4 whitespace-nowrap">
                                    <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-blue-100 text-blue-800">
                                        ${memory.type}
                                    </span>
                                </td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                                    ${formattedDate}
                                </td>
                                <td class="px-6 py-4 text-sm flex gap-2">
                                    <button onclick="deleteMemory(${index})" 
                                        class="text-red-600 hover:text-red-900 hover:underline">
                                        删除
                                    </button>
                                    ${memory.content.length > 30 ? `
                                        <button onclick="splitMemory(${index})" 
                                            class="text-yellow-600 hover:text-yellow-900 hover:underline flex items-center">
                                            <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                                                    d="M8 7v8a2 2 0 002 2h6M8 7V5a2 2 0 012-2h4.586a1 1 0 01.707.293l4.414 4.414a1 1 0 01.293.707V15a2 2 0 01-2 2h-2"/>
                                            </svg>
                                            拆分
                                        </button>
                                    ` : ''}
                                </td>
                            </tr>
                        `;
                    } catch (e) {
                        console.error('Error rendering memory row:', e);
                        return '';
                    }
                }).join('');

                // 添加复选框事件监听
                document.querySelectorAll('.memory-checkbox').forEach(checkbox => {
                    checkbox.addEventListener('change', (e) => {
                        const memoryId = parseInt(e.target.value);
                        if (e.target.checked) {
                            selectedMemories.add(memoryId);
                        } else {
                            selectedMemories.delete(memoryId);
                            // 取消选择时同时取消全选
                            document.getElementById('selectAll').checked = false;
                        }
                        updateRestructureButtonState();
                    });
                });
                
                // 更新重构按钮状态
                updateRestructureButtonState();
                
            } catch (e) {
                console.error('Error in renderMemories:', e);
                tbody.innerHTML = '<tr><td colspan="5" class="px-6 py-4 text-center text-red-600">渲染记忆列表时出错</td></tr>';
            }
        }

        // 获取记忆类型的颜色样式
        function getTypeColor(type) {
            const colors = {
                fact: 'bg-green-100 text-green-800',
                preference: 'bg-blue-100 text-blue-800',
                dialogue: 'bg-purple-100 text-purple-800'
            };
            return colors[type] || 'bg-gray-100 text-gray-800';
        }

        // 显示添加记忆模态框
        function showAddMemoryModal() {
            document.getElementById('addMemoryModal').classList.remove('hidden');
        }

        // 关闭添加记忆模态框
        function closeAddMemoryModal() {
            document.getElementById('addMemoryModal').classList.add('hidden');
        }

        // 添加新记忆
        async function addNewMemory() {
            const type = document.getElementById('memoryType').value;
            const content = document.getElementById('memoryContent').value;

            try {
                const response = await fetch('/api/memories', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ type, content })
                });

                if (response.ok) {
                    closeAddMemoryModal();
                    fetchMemories();
                }
            } catch (error) {
                console.error('Error adding memory:', error);
            }
        }

        // 重构选中的记忆
        function restructureSelectedMemories() {
            if (selectedMemories.size === 0) {
                alert('请先选择要重构的记忆');
                return;
            }
            document.getElementById('restructureModal').classList.remove('hidden');
            updateRestructurePreview();
        }

        // 更新重构预览
        async function updateRestructurePreview() {
            const template = document.getElementById('restructureTemplate').value;
            const selectedMemoryIds = Array.from(selectedMemories);
            const previewContainer = document.getElementById('restructurePreview');
            
            try {
                // 显示加载状态
                previewContainer.innerHTML = `
                    <div class="flex justify-center py-4">
                        <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-500"></div>
                    </div>
                `;

                const response = await fetch('/api/memories/restructure-preview', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        memoryIds: selectedMemoryIds,
                        template: template
                    })
                });

                if (response.ok) {
                    const data = await response.json();
                    
                    // 构建预览内容
                    const previewHTML = selectedMemoryIds.map((memoryId, index) => {
                        const originalMemory = memories.find(m => m.id === memoryId);
                        const restructuredContent = data.previews[index];
                        
                        return `
                            <div class="border rounded-lg p-4 bg-gray-50">
                                <div class="grid grid-cols-2 gap-4">
                                    <div>
                                        <h4 class="text-sm font-medium text-gray-500 mb-2">原始记忆</h4>
                                        <div class="p-3 bg-white rounded border">
                                            <p class="text-sm text-gray-800 whitespace-pre-wrap">${originalMemory.content}</p>
                                            <div class="mt-2 text-xs text-gray-500">
                                                类型: ${originalMemory.type}
                                            </div>
                                        </div>
                                    </div>
                                    <div>
                                        <h4 class="text-sm font-medium text-gray-500 mb-2">重构后</h4>
                                        <div class="p-3 bg-white rounded border border-blue-200">
                                            <p class="text-sm text-gray-800 whitespace-pre-wrap">${restructuredContent}</p>
                                            <div class="mt-2 text-xs text-gray-500">
                                                类型: ${template}
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        `;
                    }).join('');

                    previewContainer.innerHTML = previewHTML;
                    
                    // 添加动画效果
                    previewContainer.querySelectorAll('.border').forEach(el => {
                        el.classList.add('transition-all', 'duration-300', 'hover:shadow-md');
                    });

                } else {
                    previewContainer.innerHTML = `
                        <div class="p-4 bg-red-50 text-red-600 rounded">
                            获取预览失败，请重试
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Error getting restructure preview:', error);
                previewContainer.innerHTML = `
                    <div class="p-4 bg-red-50 text-red-600 rounded">
                        预览生成出错：${error.message}
                    </div>
                `;
            }
        }

        // 保存重构后的记忆
        async function saveRestructuredMemories() {
            try {
                const template = document.getElementById('restructureTemplate').value;
                const memoryIds = Array.from(selectedMemories);
                
                const response = await fetch('/api/memories/restructure', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        memoryIds: memoryIds,
                        template: template
                    })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    closeRestructureModal();
                    selectedMemories.clear();
                    await fetchMemories();  // 重新加载记忆列表
                    
                    // 高亮显示所有更新的记忆
                    if (result.updated_indices && result.updated_indices.length > 0) {
                        setTimeout(() => {
                            result.updated_indices.forEach(index => {
                                const updatedRow = document.querySelector(`tr[data-memory-id="${index}"]`);
                                if (updatedRow) {
                                    updatedRow.classList.add('bg-yellow-50');
                                    setTimeout(() => {
                                        updatedRow.classList.remove('bg-yellow-50');
                                    }, 2000);
                                }
                            });
                        }, 100);
                    }
                } else {
                    alert(`重构失败: ${result.error || '未知错误'}`);
                }
            } catch (error) {
                console.error('Error saving restructured memories:', error);
                alert('保存重构记忆时发生错误');
            }
        }

        // 关闭重构模态框
        function closeRestructureModal() {
            document.getElementById('restructureModal').classList.add('hidden');
        }

        // 更新重构按钮状态
        function updateRestructureButtonState() {
            const restructureBtn = document.getElementById('restructureBtn');
            if (restructureBtn) {
                restructureBtn.disabled = selectedMemories.size === 0;
                restructureBtn.classList.toggle('opacity-50', selectedMemories.size === 0);
            }
        }

        // 删除记忆
        async function deleteMemory(memoryId) {
            console.log('Attempting to delete memory:', memoryId); // 添加调试日志
            
            if (!confirm('确定要删除这条记忆吗？')) {
                return;
            }

            try {
                const response = await fetch('/api/memories/delete', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        memoryIds: [memoryId]
                    })
                });

                console.log('Delete response:', response); // 添加调试日志

                const result = await response.json();
                console.log('Delete result:', result); // 添加调试日志
                
                if (result.success) {
                    // 从选中集合中移除
                    selectedMemories.delete(memoryId);
                    // 重新加载记忆列表
                    await fetchMemories();
                    // 显示成功消息
                    showNotification('记忆已删除', 'success');
                } else {
                    showNotification(`删除失败: ${result.error}`, 'error');
                }
            } catch (error) {
                console.error('Error deleting memory:', error);
                showNotification('删除记忆时发生错误', 'error');
            }
        }

        // 添加通知功能
        function showNotification(message, type = 'info') {
            const notification = document.createElement('div');
            notification.className = `
                fixed bottom-4 right-4 px-6 py-3 rounded-lg shadow-lg 
                transition-all duration-300 transform translate-y-0 opacity-100
                flex items-center gap-2
                ${type === 'success' ? 'bg-green-500 text-white' : 
                  type === 'error' ? 'bg-red-500 text-white' : 
                  type === 'info' ? 'bg-blue-500 text-white' :
                  'bg-gray-500 text-white'}
            `;
            
            // 添加图标
            const icon = document.createElement('span');
            icon.className = 'text-xl';
            icon.innerHTML = type === 'success' ? '✓' : 
                            type === 'error' ? '✕' : 
                            type === 'info' ? 'ℹ' : '•';
            notification.appendChild(icon);
            
            const text = document.createElement('span');
            text.textContent = message;
            notification.appendChild(text);
            
            document.body.appendChild(notification);
            
            // 动画效果
            setTimeout(() => {
                notification.style.opacity = '0';
                notification.style.transform = 'translateY(20px)';
                setTimeout(() => {
                    notification.remove();
                }, 300);
            }, 2000);
        }

        // 添加拆分记忆的函数
        async function splitMemory(memoryId) {
            if (!confirm('确定要拆分这条记忆吗？\n\n系统将尝试将记忆拆分为多条较短的记忆。如果无法合理拆分，原记忆将保持不变。')) {
                return;
            }

            try {
                showNotification('正在拆分记忆...', 'info');
                
                const response = await fetch('/api/memories/split', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        memoryId: memoryId,
                        user_id: 'default_user'
                    })
                });

                const result = await response.json();
                
                if (result.success) {
                    // 重新加载记忆列表
                    await fetchMemories();
                    
                    // 显示成功消息
                    showNotification(`记忆已成功拆分为 ${result.new_memories.length} 条`, 'success');
                    
                    // 高亮显示新创建的记忆
                    setTimeout(() => {
                        result.new_memories.forEach(memory => {
                            const newRow = document.querySelector(`tr[data-memory-id="${memory.id}"]`);
                            if (newRow) {
                                newRow.classList.add('bg-yellow-50');
                                setTimeout(() => {
                                    newRow.classList.remove('bg-yellow-50');
                                }, 2000);
                            }
                        });
                    }, 100);
                } else {
                    // 显示更详细的错误信息
                    showNotification(
                        result.message || result.error || '拆分失败', 
                        'error'
                    );
                }
            } catch (error) {
                console.error('Error splitting memory:', error);
                showNotification('拆分记忆时发生错误', 'error');
            }
        }

        async function cleanMemories() {
            try {
                if (!confirm('确定要清理记忆吗？这将删除重复和无意义的记忆。')) {
                    return;
                }

                showNotification('正在清理记忆...', 'info');

                const response = await fetch('/api/memories/clean', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        user_id: 'default_user'
                    })
                });

                const result = await response.json();
                
                if (result.success) {
                    showNotification(result.message, 'success');
                    // 刷新记忆列表
                    await fetchMemories();
                } else {
                    showNotification('清理失败: ' + (result.error || '未知错误'), 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                showNotification('清理过程中发生错误', 'error');
            }
        }
    </script>
</body>
</html>
