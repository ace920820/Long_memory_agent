<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>记忆管理系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 添加图表库 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100">
    <div class="container mx-auto px-4 py-8">
        <!-- 顶部导航 -->
        <nav class="flex justify-between items-center mb-8">
            <h1 class="text-2xl font-bold text-gray-800">记忆管理系统</h1>
            <a href="/" class="text-blue-600 hover:text-blue-800">返回对话</a>
        </nav>

        <!-- 记忆统计面板 -->
        <div class="bg-white rounded-lg shadow p-6 mb-8">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- 基础统计 -->
                <div>
                <h3 class="text-lg font-semibold mb-4">记忆统计</h3>
                <div class="space-y-4">
                    <div class="flex justify-between items-center">
                        <span class="text-gray-600">总记忆数</span>
                        <span id="totalMemories" class="font-semibold">0</span>
                    </div>
                    <div id="typeStats" class="space-y-2">
                        <!-- 类型统计将通过JavaScript动态添加 -->
                    </div>
                </div>
            </div>
                <!-- 访问统计 -->
                <div>
                    <h3 class="text-lg font-semibold mb-4">访问统计</h3>
                    <div class="space-y-2">
                        <div class="flex justify-between items-center">
                            <span class="text-gray-600">今日访问</span>
                            <span id="todayAccess" class="font-semibold">0</span>
            </div>
                        <div class="flex justify-between items-center">
                            <span class="text-gray-600">本周访问</span>
                            <span id="weekAccess" class="font-semibold">0</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 记忆分类标签和工具栏 -->
        <div class="bg-white rounded-lg shadow p-6 mb-6">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                <!-- 记忆分类标签 -->
                <div>
                    <h2 class="text-lg font-semibold mb-3">记忆分类</h2>
                    <div class="flex flex-wrap gap-2" id="memoryTags">
                        <button class="px-3 py-1 bg-blue-100 text-blue-800 rounded-full active" data-type="all">全部</button>
                        <button class="px-3 py-1 bg-gray-100 hover:bg-blue-100 text-gray-800 rounded-full" data-type="fact">事实</button>
                        <button class="px-3 py-1 bg-gray-100 hover:bg-blue-100 text-gray-800 rounded-full" data-type="preference">偏好</button>
                        <button class="px-3 py-1 bg-gray-100 hover:bg-blue-100 text-gray-800 rounded-full" data-type="dialogue">对话</button>
                    </div>
                </div>

                <!-- 记忆管理工具 -->
                <div class="flex flex-wrap gap-4">
                    <button onclick="showAddMemoryModal()" class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">
                        添加记忆
                    </button>
                    <button onclick="restructureSelectedMemories()" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
                        重构选中
                    </button>
                    <button onclick="cleanMemories()" class="bg-yellow-500 text-white px-4 py-2 rounded hover:bg-yellow-600">
                        清理重复
                    </button>
                    <input type="text" id="searchMemory" placeholder="搜索记忆..." 
                        class="px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-300">
                </div>
            </div>
        </div>

        <!-- 记忆列表 -->
        <div class="bg-white rounded-lg shadow overflow-hidden">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50">
                    <tr>
                        <th scope="col" class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                            <input type="checkbox" id="selectAll" class="rounded">
                        </th>
                        <th scope="col" class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">内容</th>
                        <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">类型</th>
                        <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">创建时间</th>
                        <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">访问统计</th>
                        <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">操作</th>
                    </tr>
                </thead>
                <tbody id="memoriesList" class="bg-white divide-y divide-gray-200">
                    <!-- 记忆列表将在这里动态渲染 -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- 记忆详情模态框 -->
    <div id="memoryDetailModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center">
        <div class="bg-white rounded-lg p-6 w-full max-w-4xl">
            <h3 class="text-lg font-semibold mb-4">记忆详情</h3>
            <div id="memoryDetailContent" class="space-y-4">
                <!-- 记忆详情将在这里动态渲染 -->
            </div>
            <div class="mt-6 flex justify-end">
                <button onclick="closeMemoryDetailModal()" 
                    class="px-4 py-2 bg-gray-100 text-gray-800 rounded hover:bg-gray-200">关闭</button>
            </div>
        </div>
    </div>

    <!-- 添加记忆模态框 -->
    <div id="addMemoryModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center">
        <div class="bg-white rounded-lg p-6 w-full max-w-2xl">
            <h3 class="text-lg font-semibold mb-4">添加新记忆</h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">记忆类型</label>
                    <select id="memoryType" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm">
                        <option value="fact">事实</option>
                        <option value="preference">偏好</option>
                        <option value="dialogue">对话</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">记忆内容</label>
                    <textarea id="memoryContent" rows="4" 
                        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm"></textarea>
                </div>
                <div class="flex justify-end gap-4">
                    <button onclick="closeAddMemoryModal()" 
                        class="px-4 py-2 bg-gray-100 text-gray-800 rounded hover:bg-gray-200">取消</button>
                    <button onclick="addNewMemory()" 
                        class="px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600">保存</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 记忆重构模态框 -->
    <div id="restructureModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center">
        <div class="bg-white rounded-lg p-6 w-full max-w-4xl">
            <h3 class="text-lg font-semibold mb-4">重构记忆</h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">选择重构模板</label>
                    <select id="restructureTemplate" onchange="updateRestructurePreview()" 
                        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm">
                        <option value="fact">事实陈述</option>
                        <option value="preference">个人偏好</option>
                        <option value="personality">性格特征</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">重构预览</label>
                    <div id="restructurePreview" class="space-y-4">
                        <!-- 预览内容将在这里动态生成 -->
                    </div>
                </div>
                <div class="flex justify-end gap-4 mt-6">
                    <button onclick="closeRestructureModal()" 
                        class="px-4 py-2 bg-gray-100 text-gray-800 rounded hover:bg-gray-200">取消</button>
                    <button onclick="saveRestructuredMemories()" 
                        class="px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600">确认重构</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 在 body 标签的最后添加通知容器 -->
    <div id="notificationContainer" class="fixed bottom-4 right-4 z-50"></div>

    <script>
        let memories = [];
        let selectedMemories = new Set();

        // 页面加载时获取记忆
        document.addEventListener('DOMContentLoaded', () => {
            fetchMemories();
            
            // 添加全选功能
            document.getElementById('selectAll').addEventListener('change', (e) => {
                const checkboxes = document.querySelectorAll('.memory-checkbox');
                checkboxes.forEach(checkbox => {
                    checkbox.checked = e.target.checked;
                    const memoryId = parseInt(checkbox.value);
                    if (e.target.checked) {
                        selectedMemories.add(memoryId);
                    } else {
                        selectedMemories.delete(memoryId);
                    }
                });
                
                // 更新重构按钮状态
                updateRestructureButtonState();
            });

            // 添加搜索功能
            document.getElementById('searchMemory').addEventListener('input', (e) => {
                const searchText = e.target.value.toLowerCase();
                const filteredMemories = memories.filter(memory => 
                    memory.content.toLowerCase().includes(searchText)
                );
                renderMemories(filteredMemories);
            });

            // 添加分类筛选功能
            document.querySelectorAll('#memoryTags button').forEach(button => {
                button.addEventListener('click', () => {
                    const type = button.dataset.type;
                    document.querySelectorAll('#memoryTags button').forEach(b => 
                        b.classList.remove('bg-blue-100', 'text-blue-800'));
                    button.classList.add('bg-blue-100', 'text-blue-800');
                    
                    if (type === 'all') {
                        renderMemories(memories);
                    } else {
                        const filteredMemories = memories.filter(memory => 
                            memory.type === type
                        );
                        renderMemories(filteredMemories);
                    }
                });
            });
        });

        // 获取记忆列表
        async function fetchMemories() {
            try {
                const response = await fetch('/api/memories');
                const data = await response.json();
                
                console.log('Response from server:', data);  // 调试日志
                
                if (!data) {
                    throw new Error('服务器返回的数据为空');
                }

                if (data.error) {
                    throw new Error(data.error);
                }

                // 确保 memories 是数组
                memories = Array.isArray(data.memories) ? data.memories : [];
                console.log('处理后的记忆数据:', memories);  // 调试日志
                
                // 先渲染记忆列表
                renderMemories(memories);
                
                // 延迟更新统计信息，确保DOM元素已经加载
                setTimeout(() => {
                    try {
                        updateStats(memories);
                    } catch (error) {
                        console.error('更新统计信息时出错:', error);
                    }
                }, 100);
                
            } catch (error) {
                console.error('获取记忆列表时出错:', error);
                showNotification('获取记忆列表失败: ' + error.message, 'error');
            }
        }

        // 更新统计信息
        function updateStats(memories) {
            if (!Array.isArray(memories)) {
                console.error('Invalid memories data:', memories);
                return;
            }

            // 基础统计
            const stats = {
                total: memories.length,
                byType: {},
                todayAccess: 0,
                weekAccess: 0
            };

            const now = new Date();
            const today = now.toISOString().split('T')[0];
            const weekAgo = new Date(now - 7 * 24 * 60 * 60 * 1000);

            // 统计各类型记忆数量和访问数据
            memories.forEach(memory => {
                // 类型统计
                const type = memory.type || 'general';
                stats.byType[type] = (stats.byType[type] || 0) + 1;

                // 访问统计
                const accessStats = memory.access_stats || {};
                const lastAccess = accessStats.last_access ? new Date(accessStats.last_access) : null;
                
                if (lastAccess) {
                    // 今日访问
                    if (lastAccess.toISOString().split('T')[0] === today) {
                        stats.todayAccess++;
                    }
                    // 本周访问
                    if (lastAccess >= weekAgo) {
                        stats.weekAccess++;
                    }
                }
            });

            // 更新总数显示
            const totalElement = document.getElementById('totalMemories');
            if (totalElement) {
                totalElement.textContent = stats.total;
            }

            // 更新类型分布
            const typeStats = document.getElementById('typeStats');
            if (typeStats) {
                typeStats.innerHTML = Object.entries(stats.byType)
                    .map(([type, count]) => `
                        <div class="flex justify-between items-center">
                            <span class="text-gray-600">${type}</span>
                            <span class="font-semibold">${count}</span>
                        </div>
                    `).join('');
            }

            // 更新访问统计
            const todayAccessElement = document.getElementById('todayAccess');
            if (todayAccessElement) {
                todayAccessElement.textContent = stats.todayAccess;
            }

            const weekAccessElement = document.getElementById('weekAccess');
            if (weekAccessElement) {
                weekAccessElement.textContent = stats.weekAccess;
            }
        }

        // 渲染记忆列表
        function renderMemories(memoriesToRender) {
            const tbody = document.getElementById('memoriesList');
            
            if (!Array.isArray(memoriesToRender)) {
                console.error('memoriesToRender is not an array:', memoriesToRender);
                return;
            }
            
            tbody.innerHTML = memoriesToRender.map((memory, index) => {
                const date = new Date(memory.timestamp);
                const formattedDate = date.toLocaleString('zh-CN', {
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit'
                });

                // 访问统计信息
                const accessStats = memory.access_stats || {};
                const accessCount = accessStats.count || 0;
                const lastAccess = accessStats.last_access ? 
                    new Date(accessStats.last_access).toLocaleString('zh-CN', {
                        month: '2-digit',
                        day: '2-digit',
                        hour: '2-digit',
                        minute: '2-digit'
                    }) : '无访问记录';

                return `
                    <tr class="hover:bg-gray-50" data-memory-id="${index}">
                        <td class="px-4 py-4 whitespace-nowrap">
                            <input type="checkbox" class="memory-checkbox rounded" 
                                value="${index}" 
                                ${selectedMemories.has(index) ? 'checked' : ''}>
                        </td>
                        <td class="px-4 py-4">
                            <div class="text-sm text-gray-900 whitespace-pre-wrap cursor-pointer hover:text-blue-600"
                                onclick="showMemoryDetail(${index})">
                                ${memory.content}
                            </div>
                        </td>
                        <td class="px-4 py-4 whitespace-nowrap">
                            <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full ${getTypeColor(memory.type)}">
                                ${memory.type}
                            </span>
                        </td>
                        <td class="px-4 py-4 whitespace-nowrap text-sm text-gray-500">
                            ${formattedDate}
                        </td>
                        <td class="px-4 py-4 whitespace-nowrap">
                            <div class="text-sm text-gray-500">
                                <div>访问次数: ${accessCount}</div>
                                <div>最近访问: ${lastAccess}</div>
                            </div>
                        </td>
                        <td class="px-4 py-4 text-sm flex gap-2">
                            <button onclick="deleteMemory(${index})" 
                                class="text-red-600 hover:text-red-900 hover:underline">删除</button>
                            ${memory.content.length > 30 ? `
                                <button onclick="splitMemory(${index})" 
                                    class="text-yellow-600 hover:text-yellow-900 hover:underline">拆分</button>
                            ` : ''}
                        </td>
                    </tr>
                `;
            }).join('');

            // 更新统计图表
            updateMemoryStats(memoriesToRender);
        }

        // 获取记忆类型的颜色样式
        function getTypeColor(type) {
            const colors = {
                fact: 'bg-green-100 text-green-800',
                preference: 'bg-blue-100 text-blue-800',
                dialogue: 'bg-purple-100 text-purple-800'
            };
            return colors[type] || 'bg-gray-100 text-gray-800';
        }

        // 显示添加记忆模态框
        function showAddMemoryModal() {
            document.getElementById('addMemoryModal').classList.remove('hidden');
        }

        // 关闭添加记忆模态框
        function closeAddMemoryModal() {
            document.getElementById('addMemoryModal').classList.add('hidden');
        }

        // 添加新记忆
        async function addNewMemory() {
            const type = document.getElementById('memoryType').value;
            const content = document.getElementById('memoryContent').value;

            try {
                const response = await fetch('/api/memories', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ type, content })
                });

                if (response.ok) {
                    closeAddMemoryModal();
                    fetchMemories();
                }
            } catch (error) {
                console.error('Error adding memory:', error);
            }
        }

        // 重构选中的记忆
        function restructureSelectedMemories() {
            if (selectedMemories.size === 0) {
                alert('请先选择要重构的记忆');
                return;
            }
            document.getElementById('restructureModal').classList.remove('hidden');
            updateRestructurePreview();
        }

        // 更新重构预览
        async function updateRestructurePreview() {
            const template = document.getElementById('restructureTemplate').value;
            const selectedMemoryIds = Array.from(selectedMemories);
            const previewContainer = document.getElementById('restructurePreview');
            
            try {
                // 显示加载状态
                previewContainer.innerHTML = `
                    <div class="flex justify-center py-4">
                        <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-500"></div>
                    </div>
                `;

                const response = await fetch('/api/memories/restructure-preview', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        memoryIds: selectedMemoryIds,
                        template: template
                    })
                });

                if (response.ok) {
                    const data = await response.json();
                    
                    // 构建预览内容
                    const previewHTML = selectedMemoryIds.map((memoryId, index) => {
                        const originalMemory = memories.find(m => m.id === memoryId);
                        const restructuredContent = data.previews[index];
                        
                        return `
                            <div class="border rounded-lg p-4 bg-gray-50">
                                <div class="grid grid-cols-2 gap-4">
                                    <div>
                                        <h4 class="text-sm font-medium text-gray-500 mb-2">原始记忆</h4>
                                        <div class="p-3 bg-white rounded border">
                                            <p class="text-sm text-gray-800 whitespace-pre-wrap">${originalMemory.content}</p>
                                            <div class="mt-2 text-xs text-gray-500">
                                                类型: ${originalMemory.type}
                                            </div>
                                        </div>
                                    </div>
                                    <div>
                                        <h4 class="text-sm font-medium text-gray-500 mb-2">重构后</h4>
                                        <div class="p-3 bg-white rounded border border-blue-200">
                                            <p class="text-sm text-gray-800 whitespace-pre-wrap">${restructuredContent}</p>
                                            <div class="mt-2 text-xs text-gray-500">
                                                类型: ${template}
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        `;
                    }).join('');

                    previewContainer.innerHTML = previewHTML;
                    
                    // 添加动画效果
                    previewContainer.querySelectorAll('.border').forEach(el => {
                        el.classList.add('transition-all', 'duration-300', 'hover:shadow-md');
                    });

                } else {
                    previewContainer.innerHTML = `
                        <div class="p-4 bg-red-50 text-red-600 rounded">
                            获取预览失败，请重试
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Error getting restructure preview:', error);
                previewContainer.innerHTML = `
                    <div class="p-4 bg-red-50 text-red-600 rounded">
                        预览生成出错：${error.message}
                    </div>
                `;
            }
        }

        // 保存重构后的记忆
        async function saveRestructuredMemories() {
            try {
                const template = document.getElementById('restructureTemplate').value;
                const memoryIds = Array.from(selectedMemories);
                
                const response = await fetch('/api/memories/restructure', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        memoryIds: memoryIds,
                        template: template
                    })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    closeRestructureModal();
                    selectedMemories.clear();
                    await fetchMemories();  // 重新加载记忆列表
                    
                    // 高亮显示所有更新的记忆
                    if (result.updated_indices && result.updated_indices.length > 0) {
                        setTimeout(() => {
                            result.updated_indices.forEach(index => {
                                const updatedRow = document.querySelector(`tr[data-memory-id="${index}"]`);
                                if (updatedRow) {
                                    updatedRow.classList.add('bg-yellow-50');
                                    setTimeout(() => {
                                        updatedRow.classList.remove('bg-yellow-50');
                                    }, 2000);
                                }
                            });
                        }, 100);
                    }
                } else {
                    alert(`重构失败: ${result.error || '未知错误'}`);
                }
            } catch (error) {
                console.error('Error saving restructured memories:', error);
                alert('保存重构记忆时发生错误');
            }
        }

        // 关闭重构模态框
        function closeRestructureModal() {
            document.getElementById('restructureModal').classList.add('hidden');
        }

        // 更新重构按钮状态
        function updateRestructureButtonState() {
            const restructureBtn = document.getElementById('restructureBtn');
            if (restructureBtn) {
                restructureBtn.disabled = selectedMemories.size === 0;
                restructureBtn.classList.toggle('opacity-50', selectedMemories.size === 0);
            }
        }

        // 删除记忆
        async function deleteMemory(memoryId) {
            console.log('Attempting to delete memory:', memoryId); // 添加调试日志
            
            if (!confirm('确定要删除这条记忆吗？')) {
                return;
            }

            try {
                const response = await fetch('/api/memories/delete', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        memoryIds: [memoryId]
                    })
                });

                console.log('Delete response:', response); // 添加调试日志

                const result = await response.json();
                console.log('Delete result:', result); // 添加调试日志
                
                if (result.success) {
                    // 从选中集合中移除
                    selectedMemories.delete(memoryId);
                    // 重新加载记忆列表
                    await fetchMemories();
                    // 显示成功消息
                    showNotification('记忆已删除', 'success');
                } else {
                    showNotification(`删除失败: ${result.error}`, 'error');
                }
            } catch (error) {
                console.error('Error deleting memory:', error);
                showNotification('删除记忆时发生错误', 'error');
            }
        }

        // 添加通知功能
        function showNotification(message, type = 'info') {
            const notification = document.createElement('div');
            notification.className = `fixed top-4 right-4 p-4 rounded-lg shadow-lg ${
                type === 'error' ? 'bg-red-500' : 'bg-blue-500'
            } text-white max-w-md z-50`;
            notification.textContent = message;
            
            document.body.appendChild(notification);
            
            // 3秒后自动消失
            setTimeout(() => {
                notification.remove();
            }, 3000);
        }

        // 添加拆分记忆的函数
        async function splitMemory(memoryId) {
            if (!confirm('确定要拆分这条记忆吗？\n\n系统将尝试将记忆拆分为多条较短的记忆。如果无法合理拆分，原记忆将保持不变。')) {
                return;
            }

            try {
                showNotification('正在拆分记忆...', 'info');
                
                const response = await fetch('/api/memories/split', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        memoryId: memoryId,
                        user_id: 'default_user'
                    })
                });

                const result = await response.json();
                
                if (result.success) {
                    // 重新加载记忆列表
                    await fetchMemories();
                    
                    // 显示成功消息
                    showNotification(`记忆已成功拆分为 ${result.new_memories.length} 条`, 'success');
                    
                    // 高亮显示新创建的记忆
                    setTimeout(() => {
                        result.new_memories.forEach(memory => {
                            const newRow = document.querySelector(`tr[data-memory-id="${memory.id}"]`);
                            if (newRow) {
                                newRow.classList.add('bg-yellow-50');
                                setTimeout(() => {
                                    newRow.classList.remove('bg-yellow-50');
                                }, 2000);
                            }
                        });
                    }, 100);
                } else {
                    // 显示更详细的错误信息
                    showNotification(
                        result.message || result.error || '拆分失败', 
                        'error'
                    );
                }
            } catch (error) {
                console.error('Error splitting memory:', error);
                showNotification('拆分记忆时发生错误', 'error');
            }
        }

        async function cleanMemories() {
            try {
                if (!confirm('确定要清理记忆吗？这将删除重复和无意义的记忆。')) {
                    return;
                }

                showNotification('正在清理记忆...', 'info');

                const response = await fetch('/api/memories/clean', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        user_id: 'default_user'
                    })
                });

                const result = await response.json();
                
                if (result.success) {
                    showNotification(result.message, 'success');
                    // 刷新记忆列表
                    await fetchMemories();
                } else {
                    showNotification('清理失败: ' + (result.error || '未知错误'), 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                showNotification('清理过程中发生错误', 'error');
            }
        }

        // 显示记忆详情
        function showMemoryDetail(index) {
            const memory = memories[index];
            const modal = document.getElementById('memoryDetailModal');
            const content = document.getElementById('memoryDetailContent');

            const accessStats = memory.access_stats || {};
            const accessHistory = accessStats.access_history || [];

            content.innerHTML = `
                <div class="space-y-6">
                    <div>
                        <h4 class="text-sm font-medium text-gray-500 mb-2">记忆内容</h4>
                        <div class="p-4 bg-gray-50 rounded-lg">
                            <p class="text-gray-900 whitespace-pre-wrap">${memory.content}</p>
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <h4 class="text-sm font-medium text-gray-500 mb-2">基本信息</h4>
                            <div class="p-4 bg-gray-50 rounded-lg space-y-2">
                                <p>ID: ${memory.id || '无'}</p>
                                <p>类型: ${memory.type}</p>
                                <p>创建时间: ${new Date(memory.timestamp).toLocaleString()}</p>
                                <p>优先级分数: ${memory.priority_score || 0}</p>
                            </div>
                        </div>
                        
                        <div>
                            <h4 class="text-sm font-medium text-gray-500 mb-2">访问统计</h4>
                            <div class="p-4 bg-gray-50 rounded-lg space-y-2">
                                <p>总访问次数: ${accessStats.count || 0}</p>
                                <p>首次访问: ${accessStats.first_access ? new Date(accessStats.first_access).toLocaleString() : '无'}</p>
                                <p>最近访问: ${accessStats.last_access ? new Date(accessStats.last_access).toLocaleString() : '无'}</p>
                            </div>
                        </div>
                    </div>

                    <div>
                        <h4 class="text-sm font-medium text-gray-500 mb-2">最近访问历史</h4>
                        <div class="p-4 bg-gray-50 rounded-lg">
                            ${accessHistory.length > 0 ? `
                                <div class="space-y-2">
                                    ${accessHistory.map(access => `
                                        <div class="flex justify-between text-sm">
                                            <span>${new Date(access.timestamp).toLocaleString()}</span>
                                            <span class="text-gray-500">${access.type}</span>
                                        </div>
                                    `).join('')}
                                </div>
                            ` : '<p class="text-gray-500">暂无访问记录</p>'}
                        </div>
                    </div>
                </div>
            `;

            modal.classList.remove('hidden');
        }

        // 关闭记忆详情模态框
        function closeMemoryDetailModal() {
            document.getElementById('memoryDetailModal').classList.add('hidden');
        }

        // 更新统计图表
        function updateMemoryStats(memories) {
            if (!Array.isArray(memories)) {
                console.error('Invalid memories data:', memories);
                return;
            }

            // 基础统计
            const stats = {
                total: memories.length,
                byType: {}
            };

            // 统计各类型记忆数量
            memories.forEach(memory => {
                const type = memory.type || 'general';
                stats.byType[type] = (stats.byType[type] || 0) + 1;
            });

            // 更新总数显示
            const totalElement = document.getElementById('totalMemories');
            if (totalElement) {
                totalElement.textContent = stats.total;
            }

            // 更新类型分布
            const typeStats = document.getElementById('typeStats');
            if (typeStats) {
                typeStats.innerHTML = Object.entries(stats.byType)
                    .map(([type, count]) => `
                        <div class="flex justify-between items-center">
                            <span class="text-gray-600">${type}</span>
                            <span class="font-semibold">${count}</span>
                        </div>
                    `).join('');
            }

            // 更新访问频率图表
            const accessCtx = document.getElementById('accessFrequencyChart');
            if (accessCtx) {
                const accessStats = memories.map(m => m.access_stats?.count || 0);
                const accessData = {
                    '0次': accessStats.filter(count => count === 0).length,
                    '1-5次': accessStats.filter(count => count > 0 && count <= 5).length,
                    '6-10次': accessStats.filter(count => count > 5 && count <= 10).length,
                    '10次以上': accessStats.filter(count => count > 10).length
                };

                new Chart(accessCtx, {
                    type: 'bar',
                    data: {
                        labels: Object.keys(accessData),
                        datasets: [{
                            label: '记忆数量',
                            data: Object.values(accessData),
                            backgroundColor: 'rgba(54, 162, 235, 0.8)'
                        }]
                    },
                    options: {
                        responsive: true,
                        scales: {
                            y: {
                                beginAtZero: true,
                                ticks: {
                                    stepSize: 1
                                }
                            }
                        }
                    }
                });
            }

            // 更新时间分布图表
            const timeCtx = document.getElementById('timeDistributionChart');
            if (timeCtx) {
                const timeStats = {};
                memories.forEach(memory => {
                    const date = new Date(memory.timestamp);
                    const month = date.toLocaleString('zh-CN', { month: 'short' });
                    timeStats[month] = (timeStats[month] || 0) + 1;
                });

                new Chart(timeCtx, {
                    type: 'line',
                    data: {
                        labels: Object.keys(timeStats),
                        datasets: [{
                            label: '记忆数量',
                            data: Object.values(timeStats),
                            borderColor: 'rgba(75, 192, 192, 1)',
                            tension: 0.1
                        }]
                    },
                    options: {
                        responsive: true,
                        scales: {
                            y: {
                                beginAtZero: true,
                                ticks: {
                                    stepSize: 1
                                }
                            }
                        }
                    }
                });
            }
        }
    </script>
</body>
</html>
