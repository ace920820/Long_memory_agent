<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圣诞主题对话系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .gradient-bg {
            background: linear-gradient(90deg, rgba(227,32,36,0.8) 0%, rgba(0,123,0,0.8) 100%);
        }
        .christmas-header {
            background: linear-gradient(to right, #ff0000, #00ff00);
            color: white;
        }
        .snowflake {
            position: absolute;
            width: 0.5em;
            height: 0.5em;
            background: white;
            opacity: 0.8;
            border-radius: 50%;
            animation: snowfall 10s linear infinite;
        }
        @keyframes snowfall {
            from { transform: translateY(-100%); }
            to { transform: translateY(100vh); }
        }
        .chat-container {
            height: calc(100vh - 8rem);
        }
        .message-bubble {
            max-width: 80%;
            word-wrap: break-word;
        }
        .decoration-image {
            max-height: 100px;
            width: auto;
        }
    </style>
</head>
<body class="flex flex-col h-screen bg-green-100 relative">
    <div class="absolute top-4 left-4 text-xl cursor-pointer" title="帮助">❓</div>
    <div class="absolute top-4 right-4 text-xl cursor-pointer" onclick="openSettingsModal()" title="设置">⚙️</div>

    <div class="flex justify-center items-center christmas-header py-4 shadow-lg">
        <h1 class="text-2xl font-bold">🎄 圣诞快乐！！ 🎁</h1>
    </div>

    <div class="mb-4 p-4 bg-white rounded-lg shadow">
        <h3 class="text-lg font-semibold mb-2">选择对话角色</h3>
        <div class="flex flex-wrap gap-2" id="roleSelector">
        </div>
    </div>

    <div class="flex-grow flex flex-col overflow-hidden">
        <div id="messages" class="flex-grow overflow-y-auto p-6 space-y-4 bg-white shadow-lg rounded-lg mx-4 mt-4">
            <!-- 消息会动态加载到这里 -->
        </div>

        <div class="flex justify-center py-2">
            <img src="https://picx.zhimg.com/v2-0073a8a49b65ac0e83bf20db4cf4ba53_720w.jpg?source=172ae18b" alt="圣诞装饰" class="rounded-full shadow-lg decoration-image">
        </div>

        <div id="status" class="text-center text-sm text-gray-500 my-1"></div>

        <div class="flex items-center p-4 bg-white border-t border-gray-300 gradient-bg">
            <img src="/static/images/Christmas_reindeer_avatar_80x80.png" alt="助手头像" class="w-10 h-10 rounded-full mr-4 shadow-lg assistant-avatar input-avatar" id="currentAvatar">
            <input id="user_input" type="text" placeholder="请输入内容" onkeydown="checkEnter(event)" class="flex-grow px-4 py-2 border border-gray-300 rounded-lg shadow focus:outline-none focus:ring-2 focus:ring-green-500">
            <button onclick="sendMessage()" class="ml-4 px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 shadow-md focus:outline-none">发送</button>
        </div>
    </div>

    <footer class="bg-green-200 py-1 text-center text-sm text-red-600">
        2024 圣诞对话系统 - All rights reserved.
    </footer>

    <!-- 设置弹窗 -->
    <div id="settingsModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center">
        <div class="bg-white p-6 rounded-lg shadow-xl">
            <h2 class="text-xl font-bold mb-4 text-red-600">选择角色</h2>
            <div class="space-y-4">
                <div class="flex items-center space-x-4">
                    <button onclick="setRole('santa')" class="flex items-center p-3 border rounded-lg hover:bg-red-100">
                        圣诞老人
                    </button>
                    <button onclick="setRole('reindeer')" class="flex items-center p-3 border rounded-lg hover:bg-green-100">
                        驯鹿
                    </button>
                </div>
                <button onclick="closeSettingsModal()" class="w-full mt-4 px-4 py-2 bg-gray-200 rounded-lg hover:bg-gray-300">
                    关闭
                </button>
            </div>
        </div>
    </div>

    <!-- Falling Snowflakes -->
    <div class="snowflake" style="top: 0; left: 10%; animation-delay: 0s;"></div>
    <div class="snowflake" style="top: 0; left: 30%; animation-delay: 2s;"></div>
    <div class="snowflake" style="top: 0; left: 50%; animation-delay: 4s;"></div>
    <div class="snowflake" style="top: 0; left: 70%; animation-delay: 6s;"></div>
    <div class="snowflake" style="top: 0; left: 90%; animation-delay: 8s;"></div>

    <div class="management-buttons" style="position: fixed; top: 20px; right: 20px; display: flex; gap: 10px;">
        <a href="/memory-manager" class="px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 flex items-center shadow-lg">
            <span class="mdi mdi-brain mr-2"></span>
            记忆管理
        </a>

        <a href="/knowledge-base" class="px-4 py-2 bg-green-500 text-white rounded-lg hover:bg-green-600 flex items-center shadow-lg">
            <span class="mdi mdi-database mr-2"></span>
            知识库管理
        </a>
    </div>

    <script>
        function addMessage(content, type) {
            const messagesDiv = document.getElementById('messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `flex ${type === 'user' ? 'justify-end' : 'justify-start'}`;

            const bubble = document.createElement('div');
            bubble.className = `message-bubble p-3 rounded-lg ${
                type === 'user' ? 'bg-red-100' : 'bg-green-100'
            } shadow-sm flex items-start space-x-2`;

            if (type === 'assistant') {
                const avatar = document.createElement('img');
                avatar.src = document.querySelector('.input-avatar').src;
                avatar.alt = "助手头像";
                avatar.className = "w-6 h-6 rounded-full assistant-avatar";
                bubble.appendChild(avatar);
            }

            const messageText = document.createElement('span');
            messageText.className = "text-gray-800";

            // 处理不同的响应格式
            let messageContent = '';
            if (typeof content === 'string') {
                messageContent = content;
            } else if (content && typeof content === 'object') {
                if (content.error) {
                    messageContent = content.error;
                } else if (content.response) {
                    messageContent = content.response;
                } else {
                    messageContent = '无法解析的响应格式';
                }
            } else {
                messageContent = '无效的响应';
            }

            messageText.textContent = messageContent;
            bubble.appendChild(messageText);
            messageDiv.appendChild(bubble);
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        async function sendMessage() {
            const userInput = document.getElementById('user_input').value;
            if (!userInput.trim()) return;

            addMessage(userInput, 'user');
            document.getElementById('user_input').value = '';

            const statusDiv = document.getElementById('status');
            statusDiv.textContent = '正在输入...';

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_input: userInput })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const result = await response.json();

                // 添加调试日志
                console.log('Received response:', result);

                // 显示消息
                if (result.error) {
                    addMessage({ error: result.error }, 'assistant');
                } else {
                    addMessage({ response: result.response }, 'assistant');
                }

                // 显示记忆更新状态
                if (result.memory_status && result.memory_status.success) {
                    const memoryNote = document.createElement('div');
                    memoryNote.className = 'text-xs text-gray-500 mt-1 italic text-center';
                    memoryNote.textContent = `${result.memory_status.message}: ${result.memory_status.content.split('\n')[0]}`;
                    document.getElementById('messages').appendChild(memoryNote);
                }
            } catch (error) {
                console.error('Error:', error);
                addMessage('网络异常，请稍后重试。', 'assistant');
            } finally {
                statusDiv.textContent = '';
            }
        }

        function checkEnter(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        function openSettingsModal() {
            document.getElementById('settingsModal').classList.remove('hidden');
        }

        function closeSettingsModal() {
            document.getElementById('settingsModal').classList.add('hidden');
        }

        async function setRole(role) {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = '正在设置角色...';

            try {
                const response = await fetch('/set_role', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: 'default_user',
                        role: role
                    })
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    // 使用getRoleName函数获取正确的角色名称
                    const roleName = getRoleName(role);
                    updateAvatar(role);
                    addMessage(`角色已切换为: ${roleName}`, 'assistant');
                    closeSettingsModal();
                } else {
                    const errorMessage = result.error || '角色设置失败';
                    addMessage(`设置失败: ${errorMessage}`, 'assistant');
                    console.error('Role setting failed:', result);
                }
            } catch (error) {
                console.error('Error setting role:', error);
                addMessage('设置角色时发生错误，请稍后重试。', 'assistant');
            } finally {
                statusDiv.textContent = '';
            }
        }

        function updateAvatar(role) {
            const avatarImages = document.querySelectorAll('.assistant-avatar');
            const newSrc = role === 'santa'
                ? "https://picx.zhimg.com/v2-0073a8a49b65ac0e83bf20db4cf4ba53_720w.jpg?source=172ae18b"
                : "/static/images/Christmas_reindeer_avatar_80x80.png";

            avatarImages.forEach(img => {
                img.src = newSrc;
            });
        }

        function openMemoryManager() {
            // 在新窗口打开记忆管理页面
            window.open('/memory-manager', '_blank', 'width=800,height=600');
        }

        // 角色配置
        const roleConfig = {
            reindeer: {
                name: '驯鹿',
                avatar: '/static/images/Christmas_reindeer_avatar_80x80.png'
            },
            santa: {
                name: '圣诞老人',
                avatar: '/static/images/santa_avatar.png'
            },
            elf: {
                name: '圣诞精灵',
                avatar: '/static/images/elf_avatar.png'
            },
            assistant: {
                name: '个人助理',
                avatar: '/static/images/assistant_avatar.png'
            }
        };

        // 角色切换功能
        const roleButtons = document.querySelectorAll('.role-btn');
        let currentRole = 'reindeer';

        roleButtons.forEach(button => {
            button.addEventListener('click', async () => {
                const role = button.dataset.role;

                try {
                    const response = await fetch('/set_role', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            user_id: 'default_user',
                            role: role
                        })
                    });

                    const result = await response.json();

                    if (response.ok && result.success) {
                        // 更新按钮状态
                        roleButtons.forEach(btn => {
                            btn.classList.remove('bg-blue-100', 'text-blue-800', 'active');
                            btn.classList.add('bg-gray-100', 'text-gray-800');
                        });
                        button.classList.remove('bg-gray-100', 'text-gray-800');
                        button.classList.add('bg-blue-100', 'text-blue-800', 'active');

                        // 更新当前角色
                        currentRole = role;

                        // 更新头像（如果有的话）
                        if (roleConfig[role]) {
                            updateAssistantAvatar(role);
                        }

                        // 添加系统消息提示角色切换
                        appendMessage('系统', result.message, 'system');
                    } else {
                        console.error('Failed to set role:', result.error);
                        appendMessage('系统', '切换角色失败，请重试', 'error');
                    }
                } catch (error) {
                    console.error('Error:', error);
                    appendMessage('系统', '切换角色时发生错误', 'error');
                }
            });
        });

        // 获取角色的中文名称
        function getRoleName(role) {
            return window.roleDescriptions?.[role]?.name || role;
        }

        // 获取角色的中文名称和头像
        function getRoleInfo(role) {
            const info = window.roleDescriptions?.[role] || {};
            return {
                name: info.name || role,
                avatar: info.avatar || ''
            };
        }

        // 更新当前角色头像
        function updateAvatar(role) {
            const roleInfo = getRoleInfo(role);
            const currentAvatar = document.getElementById('currentAvatar');
            if (currentAvatar && roleInfo.avatar) {
                currentAvatar.src = roleInfo.avatar;
                currentAvatar.alt = roleInfo.name;
            }
        }

        // 动态生成角色按钮
        async function generateRoleButtons() {
            try {
                const response = await fetch('/get_available_roles');
                const result = await response.json();
                
                if (response.ok && result.success) {
                    const roleSelector = document.getElementById('roleSelector');
                    roleSelector.innerHTML = ''; // 清空现有按钮
                    window.roleDescriptions = result.roles; // 保存角色描述信息供后续使用
                    
                    Object.entries(result.roles).forEach(([role, info]) => {
                        const button = document.createElement('button');
                        button.className = `role-btn px-4 py-2 rounded-full text-sm font-medium transition-colors duration-200
                                          bg-gray-100 text-gray-800 hover:bg-gray-200`;
                        button.dataset.role = role;
                        button.textContent = info.name;
                        if (info.description) {
                            button.title = info.description;
                        }
                        roleSelector.appendChild(button);
                    });
                    
                    // 为新生成的按钮添加点击事件
                    document.querySelectorAll('.role-btn').forEach(btn => {
                        btn.addEventListener('click', () => {
                            const role = btn.dataset.role;
                            document.querySelectorAll('.role-btn').forEach(b => {
                                if (b === btn) {
                                    b.classList.add('bg-blue-100', 'text-blue-800');
                                    b.classList.remove('bg-gray-100', 'text-gray-800');
                                } else {
                                    b.classList.remove('bg-blue-100', 'text-blue-800');
                                    b.classList.add('bg-gray-100', 'text-gray-800');
                                }
                            });
                            setRole(role);
                        });
                    });
                }
            } catch (error) {
                console.error('Error generating role buttons:', error);
            }
        }

        // 在页面加载完成后获取角色信息并生成按钮
        document.addEventListener('DOMContentLoaded', async () => {
            await generateRoleButtons();  // 先生成按钮
            await getDefaultRole();       // 然后设置默认角色
        });

        async function getDefaultRole() {
            try {
                const response = await fetch('/get_default_role');
                const result = await response.json();
                if (response.ok && result.default_role) {
                    setRole(result.default_role);
                    // 更新按钮状态
                    document.querySelectorAll('.role-btn').forEach(btn => {
                        if (btn.dataset.role === result.default_role) {
                            btn.classList.add('bg-blue-100', 'text-blue-800');
                            btn.classList.remove('bg-gray-100', 'text-gray-800');
                        } else {
                            btn.classList.remove('bg-blue-100', 'text-blue-800');
                            btn.classList.add('bg-gray-100', 'text-gray-800');
                        }
                    });
                }
            } catch (error) {
                console.error('Error getting default role:', error);
            }
        }

        // 添加消息到聊天界面的辅助函数
        function appendMessage(sender, message, type = 'chat') {
            const chatBox = document.getElementById('messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `mb-4 ${type === 'system' ? 'text-center text-gray-500' : ''}`;
            
            if (type === 'chat') {
                const isUser = sender === 'user';
                const currentRole = document.querySelector('.role-btn.active')?.dataset.role;
                const roleInfo = getRoleInfo(currentRole);
                
                // 为每个消息保存发送时的角色信息
                const messageRoleInfo = isUser ? null : {
                    role: currentRole,
                    avatar: roleInfo.avatar,
                    name: roleInfo.name
                };
                
                messageDiv.innerHTML = `
                    <div class="flex ${isUser ? 'justify-end' : 'justify-start'}">
                        ${!isUser ? `<img src="${messageRoleInfo.avatar}" alt="${messageRoleInfo.name}" class="w-8 h-8 rounded-full mr-2">` : ''}
                        <div class="${isUser ? 'bg-blue-500 text-white' : 'bg-gray-200'} rounded-lg px-4 py-2 max-w-[70%]">
                            ${message}
                        </div>
                        ${isUser ? '<img src="/static/images/user_avatar.png" alt="User" class="w-8 h-8 rounded-full ml-2">' : ''}
                    </div>
                `;
            } else {
                messageDiv.textContent = message;
            }
            
            chatBox.appendChild(messageDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
